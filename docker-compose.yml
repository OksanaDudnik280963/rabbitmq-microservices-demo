services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    image: ${DOCKER_NAMESPACE:-local}/order-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile.order-service
    ports:
      - "8081:8081"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: password
    depends_on:
      rabbitmq:
        condition: service_healthy

  inventory-service:
    image: ${DOCKER_NAMESPACE:-local}/inventory-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile.inventory-service
    ports:
      - "8082:8082"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: password
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    image: ${DOCKER_NAMESPACE:-local}/notification-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile.notification-service
    ports:
      - "8083:8083"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: password
    depends_on:
      rabbitmq:
        condition: service_healthy